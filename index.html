<title>門徒教會字幕工具</title>
<style>
  :root { --bg:#fbfaf7; --fg:#222; --muted:#666; --accent:#7a5c2e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1a18; --fg:#eee; --muted:#aaa; --accent:#d9b77a; } }
  body { background:var(--bg); color:var(--fg); font:16px/1.8 system-ui,"PingFang TC","Noto Sans TC",sans-serif; margin:0; padding:0 16px; }
  main { max-width:680px; margin:48px auto; }
  h1 { font-size:1.6rem; margin-bottom:.2em; }
  p.sub { color:var(--muted); margin-top:0; }

<body>
<main>
  <h1>門徒教會字幕工具</h1>
  <p class="sub">MTChurch Stream Caption Tool</p>
  <p>這是門徒教會媒體同工內部使用的小工具，用來整理每週主日崇拜直播：</p>
  <ul>
    <li>偵測教會 YouTube 頻道已結束的主日直播</li>
    <li>產生繁體中文字幕、YouTube 章節時間軸與講道摘要</li>
    <li>讀取教會雲端硬碟上的週報，用來校正人名與詩歌名稱</li>
    <li>經同工審核後，將字幕與時間軸上傳回教會自己的 YouTube 影片</li>
  </ul>
  <p>本工具只供教會自己的帳號使用，不對外提供服務。</p>
  <p><a href="privacy.html">隱私權政策</a></p>
  <footer>聯絡方式：josephyucc2@gmail.com</footer>
</main>
